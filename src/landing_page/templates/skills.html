<div class="skills-layout">
  <div class="skills-tree">
    {categories}
  </div>
  <div id="skill-viewer" class="skill-viewer">
    <p class="viewer-placeholder">Select a skill to view its content</p>
  </div>
</div>
<style>

  padding:1rem;

  overflow-y:auto;
  max-height:420px;
