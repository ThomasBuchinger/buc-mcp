<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUC-MCP · Server Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/htmx.org@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-primary:#0a0c12;
  --bg-surface:#11141f;
  --bg-card:#161a28;
  --bg-card-hover:#1c2133;
  --border:#262b3e;
  --border-active:#f5a623;
  --text-primary:#e2e4ee;
  --text-secondary:#888caa;
  --text-muted:#5a5e7a;
  --accent:#f5a623;
  --accent-dim:#b37a16;
  --accent-glow:rgba(245,166,35,0.08);
  --green:#34d399;
  --red:#f87171;
  --blue:#60a5fa;
  --radius:8px;
  --font-display:'Sora',system-ui,sans-serif;
  --font-mono:'JetBrains Mono','Fira Code',monospace;
}
body{
  font-family:var(--font-display);
  background:var(--bg-primary);
  color:var(--text-primary);
  min-height:100vh;
  line-height:1.6;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(245,166,35,0.03),transparent);
  pointer-events:none;
  z-index:0;
}
.app-header{
  position:relative;
  z-index:1;
  padding:2rem 1.5rem 1rem;
  border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,var(--bg-surface),transparent);
}
.header-inner{
  max-width:1120px;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.header-left{display:flex;align-items:center;gap:1rem}
.header-icon{
  width:40px;height:40px;
  border-radius:var(--radius);
  background:var(--accent-glow);
  border:1px solid var(--border-active);
  display:flex;align-items:center;justify-content:center;
  font-size:1.25rem;color:var(--accent);
}
.header-title{font-size:1.25rem;font-weight:700;letter-spacing:-0.02em;color:var(--text-primary)}
.header-sub{font-size:0.8rem;color:var(--text-secondary);font-weight:400;margin-top:-0.1rem}
.header-right{display:flex;align-items:center;gap:0.75rem}
.live-badge{
  display:flex;align-items:center;gap:0.4rem;
  font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;
  color:var(--green);
  padding:0.3rem 0.6rem;
  border:1px solid rgba(52,211,153,0.2);
  border-radius:100px;
  background:rgba(52,211,153,0.06);
}
.live-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--green);
  animation:pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(52,211,153,0.4)}50%{opacity:0.6;box-shadow:0 0 0 4px rgba(52,211,153,0)}}
.version-tag{
  font-size:0.65rem;font-family:var(--font-mono);
  color:var(--text-muted);
  padding:0.2rem 0.5rem;
  border:1px solid var(--border);
  border-radius:4px;
}
.main-content{
  position:relative;
  z-index:1;
  max-width:1120px;
  margin:0 auto;
  padding:1.5rem;
  display:flex;
  flex-direction:column;
  gap:1.25rem;
}
.section-panel{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  transition:border-color 0.2s;
  opacity:0;
  animation:fade-slide-in 0.4s ease-out forwards;
}
.section-panel:nth-child(1){animation-delay:0.05s}
.section-panel:nth-child(2){animation-delay:0.15s}
.section-panel:nth-child(3){animation-delay:0.25s}
.section-panel:nth-child(4){animation-delay:0.35s}
.section-panel:hover{border-color:var(--border-active)}
@keyframes fade-slide-in{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
.section-header{
  display:flex;align-items:center;gap:0.6rem;
  padding:0.85rem 1.25rem;
  font-size:0.75rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;
  color:var(--text-secondary);
  border-bottom:1px solid var(--border);
  background:var(--bg-surface);
}
.section-icon{font-size:0.9rem}
.section-body{
  padding:1.25rem;
  font-size:0.88rem;
}
.htmx-indicator{
  display:flex;align-items:center;justify-content:center;
  padding:2rem;
  color:var(--text-muted);
  font-size:0.8rem;
  gap:0.5rem;
}
.htmx-indicator::before{
  content:'';
  width:16px;height:16px;
  border:2px solid var(--border);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin 0.6s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-skeleton{height:3rem;background:var(--bg-card);border-radius:var(--radius)}
</style>
</head>
<body>
<header class="app-header">
  <div class="header-inner">
    <div class="header-left">
      <div class="header-icon">⚡</div>
      <div>
        <div class="header-title">BUC-MCP</div>
        <div class="header-sub">Server Inventory &amp; Control Dashboard</div>
      </div>
    </div>
    <div class="header-right">
      <span class="live-badge"><span class="live-dot"></span>Live</span>
      <span class="version-tag">v0.1.0</span>
    </div>
  </div>
</header>
<main class="main-content">
  <section class="section-panel" id="section-sync">
    <div class="section-header"><span class="section-icon">⌨️</span> Quick Start</div>
    <div class="section-body" hx-get="/sections/sync" hx-trigger="load" hx-swap="innerHTML">
      <div class="htmx-indicator">Loading</div>
    </div>
  </section>
  <section class="section-panel" id="section-servers">
    <div class="section-header"><span class="section-icon">🖥️</span> MCP Servers</div>
    <div class="section-body" hx-get="/sections/servers" hx-trigger="load" hx-swap="innerHTML">
      <div class="htmx-indicator">Loading</div>
    </div>
  </section>
  <section class="section-panel" id="section-skills">
    <div class="section-header"><span class="section-icon">📂</span> Skills</div>
    <div class="section-body" hx-get="/sections/skills" hx-trigger="load" hx-swap="innerHTML">
      <div class="htmx-indicator">Loading</div>
    </div>
  </section>
  <section class="section-panel" id="section-configs">
    <div class="section-header"><span class="section-icon">⚙️</span> MCP Configs</div>
    <div class="section-body" hx-get="/sections/configs" hx-trigger="load" hx-swap="innerHTML">
      <div class="htmx-indicator">Loading</div>
    </div>
  </section>
</main>
</body>
</html>
